[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadcraft-toolchain"
version = "0.1.0"
description = "Pinned RoadCraft source, package and evidence workflow orchestration"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
roadcraft = "roadcraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
