[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadcraft-toolchain"
version = "0.1.0"
description = "Create and modify RoadCraft mods with shared authoring workflows, checks and evidence"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
review = ["cryptography>=42"]

[project.scripts]
roadcraft = "roadcraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
