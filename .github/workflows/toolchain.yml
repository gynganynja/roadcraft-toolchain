name: Toolchain checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain, review verifier and MCP SDK
        run: python -m pip install -e ".[review]" -r requirements-mcp.txt
      - name: Verify Ed25519 review dependency
        run: python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey; print('Ed25519 ready')"
      - name: Run synthetic safety and schema checks
        run: python -B -m unittest discover -s tests -q
