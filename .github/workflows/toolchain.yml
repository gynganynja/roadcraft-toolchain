name: Toolchain checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install toolchain and MCP SDK
        run: python -m pip install -e . -r requirements-mcp.txt
      - name: Run synthetic safety and schema checks
        run: python -B -m unittest discover -s tests -q
